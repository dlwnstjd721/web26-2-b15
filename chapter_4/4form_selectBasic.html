<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>4Form Select Basic</title>
</head>

<body>
    <h2>선택 가능한 입력 양식</h2>
    <select>
        <option>후라이드</option>
        <option>양념</option>
        <option>간장</option>
        <option>치즈</option>
        <option>파닭</option>
    </select>

    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>후라이드</option>
        <option>양념</option>
        <option>간장</option>
        <option>치즈</option>
        <option>파닭</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <select>
       <optgroup label="HTML5">
            <option>Multimedia Tag</option>
            <option>Connectivity</option>
            <option>Device Access</option>
       </optgroup>
       <optgroup label="CSS3">
            <option>Animation</option>
            <option>3D Transforms</option>
       </optgroup>
    </select>
</body>

</html>
